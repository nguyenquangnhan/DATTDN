[project]
name = "docugraph-rag-backend"
version = "0.1.0"
description = "DocuGraph RAG - Python Backend with GraphRAG & Gemini"
requires-python = ">=3.12"
dependencies = [
    # Framework
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "python-multipart>=0.0.9",
    # AI / RAG
    "langchain>=0.3",
    "langchain-google-genai>=2.0",
    "langchain-community>=0.3",
    "langchain-text-splitters>=0.3",
    # Database
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.30",
    "neo4j>=5.12.0",
    # Document Processing
    "pymupdf>=1.24",
    "paddleocr>=2.8",
    "paddlepaddle>=2.6",
    "pillow>=10.0",
    # Web Scraping
    "beautifulsoup4>=4.12",
    "httpx>=0.27",
    # Authentication
    "pyjwt>=2.8.0",
    "passlib[bcrypt]>=1.7.4",
    "bcrypt>=4.0.0",
    "email-validator>=2.0.0",
    # Utils
    "python-dotenv>=1.0",
    "pydantic-settings>=2.0",
    "aiofiles>=24.0",
]

[tool.uv]
dev-dependencies = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "httpx>=0.27",
]
